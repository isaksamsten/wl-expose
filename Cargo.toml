[package]
name = "wl-expose"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Window overview (exposé) for Wayland compositors"

[dependencies]
clap = { version = "4", features = ["derive"] }
drm-fourcc = "2"
gbm = { version = "0.18", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
smithay-client-toolkit = "0.21"
toml = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# The randomized layout tests run thousands of layouts.
[profile.test]
opt-level = 2
